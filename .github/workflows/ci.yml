name: CI Pipeline

on:
  push:
    branches: [ main, "feature/**", "fix/**", "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  cpp-fullstack-build-and-test:
    name: C++20 Full-Stack Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasio-dev python3

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Targets
        run: |
          cmake --build build --config Release

      - name: Run C++ Automated Unit & Integration Tests
        env:
          JWT_SECRET: "ci_production_ready_cryptographic_secret_key_256_bits_length"
        run: |
          ./build/attendance_tests

      - name: Launch Full-Stack C++ Web Server
        env:
          JWT_SECRET: "ci_production_ready_cryptographic_secret_key_256_bits_length"
        run: |
          ./build/attendance_server &
          sleep 3

      - name: Run Full-Stack Web App UI & Session Verification
        run: |
          python3 scripts/verify_fullstack_cpp.py

      - name: Run Comprehensive Security & REST API Verification
        run: |
          python3 scripts/verify_security_and_api.py
