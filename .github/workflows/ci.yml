name: CI Pipeline

on:
  push:
    branches: [ main, "fix/**", "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-and-test:
    name: Backend Build & C++ Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasio-dev

      - name: Configure CMake
        run: |
          cmake -B backend/build -S backend -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Targets
        run: |
          cmake --build backend/build --config Release

      - name: Run C++ Automated Test Suite
        env:
          JWT_SECRET: "ci_production_ready_cryptographic_secret_key_256_bits_length"
        run: |
          ./backend/build/attendance_tests

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

  security-e2e-verification:
    name: Security & REST Verification
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasio-dev python3

      - name: Build Backend
        run: |
          cmake -B backend/build -S backend -DCMAKE_BUILD_TYPE=Release
          cmake --build backend/build --config Release

      - name: Start C++ Backend Server
        env:
          JWT_SECRET: "ci_production_ready_cryptographic_secret_key_256_bits_length"
        run: |
          ./backend/build/attendance_server &
          sleep 3

      - name: Run Comprehensive Security Verification Suite
        run: |
          python3 scripts/verify_security_and_api.py
